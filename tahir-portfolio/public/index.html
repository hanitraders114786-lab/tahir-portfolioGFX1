<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00E5FF">
<title>Tahir | Graphic Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div>
<header class="nav glass"><a class="logo" href="#home" id="logo">T</a>
  <nav><a href="#about">About</a><a href="#experience">Experience</a><a href="#work">Work</a><a href="#reviews">Reviews</a><a href="#certs">Certificates</a><a href="#contact">Contact</a></nav>
</header>
<main>
  <section id="home" class="hero">
    <div class="hero-text">
    <h1 id="heroName" aria-label="Tahir"></h1>
    <p class="role" id="heroRole"></p>
    <p class="tagline" id="heroTagline"></p>
    <div class="actions"><a class="btn" href="#contact">Contact me</a><a class="btn ghost" id="cv" href="#">Download CV</a></div>
    </div>
    <figure class="portrait glass"><div class="frame"><img id="photo" src="/assets/headshot-placeholder.svg" alt="Portrait of Tahir"></div></figure>
  </section>
  <div class="marquee glass" aria-hidden="true"><div class="track" id="marquee"></div></div>
  <section id="about" class="wrap two"><div><h2>About</h2><div id="aboutText"></div></div><div><h2>Tools & skills</h2><ul class="chips" id="skills"></ul></div></section>
  <section id="experience" class="wrap"><h2>Experience</h2><div id="exp"></div></section>
  <section id="work" class="wrap"><h2>Work</h2><div class="filters" id="filters"></div><div class="grid" id="grid"></div></section>
  <section id="reviews" class="wrap"><h2>Reviews</h2><div class="quotes" id="quotes"></div></section>
  <section id="certs" class="wrap"><h2>Certificates</h2><ul class="certs" id="certList"></ul></section>
  <section id="contact" class="wrap contact"><h2>Let's work together</h2><p id="contactText"></p><a class="btn big" id="mail" href="#">Say hello</a><div class="socials" id="socials"></div></section>
</main>
<footer>Designed & built by <span id="foot"></span></footer>
<div class="lightbox" id="lb"><img alt=""></div>
<script src="/js/main.js"></script>
</body>
</html>
